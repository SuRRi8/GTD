# Veröffentlicht die App auf GitHub Pages unter https://<name>.github.io/<repo>/
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
# Läuft bei jedem Push auf main oder per Hand (Actions → GitHub Pages → Run workflow).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build für den Unterpfad /<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages kennt keine Weiterleitungen: 404.html lädt die App auch bei Direktlinks
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
